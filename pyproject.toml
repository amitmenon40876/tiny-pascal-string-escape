[project]
name = "tiny-pascal-string-escape"
version = "0.1.0"
description = "Turns Pascal and Delphi string literals with character escapes into Python strings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
